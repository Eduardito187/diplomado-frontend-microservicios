server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    # Hashed assets can be cached aggressively.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every other path goes to index.html so Angular Router handles it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached — new deploys must load the fresh bundle hashes.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
