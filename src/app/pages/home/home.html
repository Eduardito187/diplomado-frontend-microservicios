<main class="home-page py-4 py-lg-5">
  <div class="container">
    <header class="dashboard-header p-4 p-lg-5 mb-4">
      <div class="d-flex flex-wrap justify-content-between align-items-start gap-3">
        <div>
          <span class="eyebrow">Dashboard</span>
          <h1 class="display-6 mt-2 mb-2">Frontend de Microservicios</h1>
          <p class="mb-0 text-secondary">Base lista para conectar backends y escalar por dominio.</p>
        </div>
        <button class="btn btn-outline-danger" (click)="logout()">
          <i class="bi bi-box-arrow-right me-2"></i>
          Cerrar sesion
        </button>
      </div>
    </header>

    <section class="row g-3">
      @for (item of cards; track item.title) {
      <div class="col-md-6 col-xl-4">
        <article class="module-card p-4 h-100">
          <i class="bi {{ item.icon }} module-icon"></i>
          <h2 class="h5 mt-3">{{ item.title }}</h2>
          <p class="mb-0 text-secondary">{{ item.description }}</p>
        </article>
      </div>
      }
    </section>
  </div>
</main>
