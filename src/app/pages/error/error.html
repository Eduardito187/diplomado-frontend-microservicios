@let e = info();
<section class="error-page">
  <div class="error-card">
    <div class="error-code">{{ e.code || '?' }}</div>
    <div class="error-icon">
      <i class="bi {{ e.icon }}"></i>
    </div>
    <h1 class="error-title">{{ e.title }}</h1>
    <p class="error-desc">{{ e.description }}</p>

    <div class="error-actions">
      @if (e.cta === 'login') {
        <a class="btn btn-brand" routerLink="/login">
          <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar sesión
        </a>
      } @else if (e.cta === 'home') {
        <a class="btn btn-brand" routerLink="/">
          <i class="bi bi-house-door me-2"></i>Volver al inicio
        </a>
      } @else {
        <button type="button" class="btn btn-brand" (click)="goBack()">
          <i class="bi bi-arrow-left me-2"></i>Volver
        </button>
      }
      <a class="btn btn-outline" routerLink="/admin/dashboard">
        <i class="bi bi-grid-1x2 me-2"></i>Ir al panel
      </a>
    </div>
  </div>
</section>
