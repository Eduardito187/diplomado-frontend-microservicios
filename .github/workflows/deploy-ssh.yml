name: Release (SSH)

on:
  push:
    branches: [ "production" ]

concurrency:
  group: release-production
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Build
  # Validates the Angular build before releasing.
  # ─────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build -- --configuration production

      - name: Verify dist output
        run: test -s dist/frontend-microservicios/browser/index.html

      - name: Build deploy artifact
        run: |
          git archive --format=tar.gz -o app.tgz HEAD
          test -s app.tgz

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-artifact
          path: app.tgz
          retention-days: 1

  # ─────────────────────────────────────────────
  # Job 2: Release
  # Deploys to the production VPS via SSH.
  # The docker image builds Angular inside a multi-stage
  # Dockerfile, so the VPS doesn't need Node installed.
  # ─────────────────────────────────────────────
  release:
    name: Release to Production
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    env:
      APP_DIR: ${{ vars.VPS_APP_DIR || '/opt/diplomado-frontend-microservicios' }}

    steps:
      - name: Download deploy artifact
        uses: actions/download-artifact@v4
        with:
          name: app-artifact

      - name: Upload artifact to VPS (/tmp)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_ROOT }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          source: "app.tgz"
          target: "/tmp"
          overwrite: true

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_DIR: ${{ env.APP_DIR }}
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_ROOT }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          envs: APP_DIR
          script: |
            set -eu
            (set -o pipefail) 2>/dev/null || true

            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE="docker-compose"
            else
              echo "[deploy] ERROR: docker compose no está instalado."
              exit 1
            fi

            echo "[deploy] APP_DIR=${APP_DIR}"

            if [ -f "${APP_DIR}/docker-compose.yml" ]; then
              cd "${APP_DIR}"
              $COMPOSE down || true
            fi

            # `.env` is NOT in the tarball (gitignored), so the server-side
            # .env is preserved across deploys.
            mkdir -p "${APP_DIR}"
            tar -xzf /tmp/app.tgz -C "${APP_DIR}"
            rm -f /tmp/app.tgz

            cd "${APP_DIR}"

            if [ ! -f .env ]; then
              echo "[deploy] WARN: .env no existe en ${APP_DIR}. Usando defaults del compose."
            fi

            export DOCKER_BUILDKIT=0
            export COMPOSE_DOCKER_CLI_BUILD=0
            $COMPOSE up -d --build
            $COMPOSE ps

      # ── Post-deploy monitoring ─────────────────
      - name: Monitor – container health & HTTP check
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_DIR: ${{ env.APP_DIR }}
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_ROOT }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          envs: APP_DIR
          script: |
            set -eu

            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            else
              COMPOSE="docker-compose"
            fi

            cd "${APP_DIR}"

            PORT=$(grep -E '^FRONTEND_PORT=' .env 2>/dev/null | cut -d= -f2 || echo 8090)
            PORT=${PORT:-8090}

            echo "══════════════════════════════════════"
            echo " Container status"
            echo "══════════════════════════════════════"
            $COMPOSE ps

            echo ""
            echo "══════════════════════════════════════"
            echo " Frontend reachability (port ${PORT})"
            echo "══════════════════════════════════════"
            curl -fsS -o /dev/null -w "HTTP %{http_code}\n" "http://localhost:${PORT}/" \
              || echo "[monitor] frontend no respondió en :${PORT}."

            echo ""
            echo "══════════════════════════════════════"
            echo " Last 50 log lines (frontend)"
            echo "══════════════════════════════════════"
            $COMPOSE logs --tail=50 frontend 2>/dev/null || $COMPOSE logs --tail=50
